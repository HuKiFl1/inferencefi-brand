<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-labelledby="reward-streams-title reward-streams-desc">
  <title id="reward-streams-title">Three reward streams</title>
  <desc id="reward-streams-desc">Verified spend, time-weighted liquidity and fees paid flow into a dashed circle: a reward token that is still to be decided and does not exist.</desc>
  <g fill="none" stroke-width="6" stroke-linecap="round">
    <path d="M20 40C140 40 184 92 270 96" style="stroke:var(--series-1,#006A80)"/>
    <path d="M20 100H270" style="stroke:var(--series-2,#C2410C)"/>
    <path d="M20 160C140 160 184 108 270 104" style="stroke:var(--series-3,#5B45B0)"/>
  </g>
  <circle cx="20" cy="40" r="9" style="fill:var(--series-1,#006A80)"/>
  <circle cx="20" cy="100" r="9" style="fill:var(--series-2,#C2410C)"/>
  <circle cx="20" cy="160" r="9" style="fill:var(--series-3,#5B45B0)"/>
  <circle cx="326" cy="100" r="52" fill="none" stroke-width="3" stroke-dasharray="7 9" stroke-linecap="round" style="stroke:var(--text-muted,#56656D)"/>
  <circle cx="326" cy="100" r="30" fill="none" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round" style="stroke:var(--border-strong,#7E8C93)"/>
</svg>
